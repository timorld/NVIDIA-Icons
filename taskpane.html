<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NVIDIA Icon Library</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nvidia-green: #76B900;
      --nvidia-dark: #1a1a1a;
      --border: #e0e0e0;
      --bg: #f8f8f8;
      --card-hover-bg: #f0f7e6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--nvidia-dark);
      padding: 8px;
      min-height: 100vh;
    }

    /* Header */
    .header {
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--nvidia-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header h1 .dot {
      width: 8px; height: 8px;
      background: var(--nvidia-green);
      border-radius: 50%;
      display: inline-block;
    }
    .header p {
      color: #666;
      font-size: 11px;
      margin-top: 2px;
    }

    /* Controls */
    .controls {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-wrap {
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      padding: 7px 8px 7px 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    #searchInput:focus { border-color: var(--nvidia-green); }

    .filters-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #categorySelect {
      flex: 1;
      padding: 5px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      background: #fff;
      outline: none;
      cursor: pointer;
    }
    #categorySelect:focus { border-color: var(--nvidia-green); }

    .size-btns {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .size-btn {
      border: none;
      background: #fff;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: #666;
      transition: background 0.15s, color 0.15s;
    }
    .size-btn:not(:last-child) { border-right: 1px solid var(--border); }
    .size-btn.active { background: var(--nvidia-green); color: #fff; }
    .size-btn:hover:not(.active) { background: #f5f5f5; }

    /* Results bar */
    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
      margin-bottom: 6px;
      font-size: 11px;
      color: #666;
      min-height: 18px;
    }
    .smart-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #f0f7e6;
      color: var(--nvidia-green);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 6px;
    }
    .clear-btn {
      background: none;
      border: none;
      color: var(--nvidia-green);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    .clear-btn:hover { text-decoration: underline; }

    /* Grid */
    .icon-grid {
      display: grid;
      gap: 6px;
    }
    .icon-grid.size-small  { grid-template-columns: repeat(5, 1fr); }
    .icon-grid.size-medium { grid-template-columns: repeat(4, 1fr); }
    .icon-grid.size-large  { grid-template-columns: repeat(3, 1fr); }

    /* Icon card */
    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 4px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }
    .icon-card:hover {
      border-color: var(--nvidia-green);
      background: var(--card-hover-bg);
      box-shadow: 0 2px 8px rgba(118,185,0,0.15);
    }

    .icon-svg-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      transition: color 0.15s;
    }
    .icon-card:hover .icon-svg-wrap { color: var(--nvidia-green); }

    .icon-grid.size-small  .icon-svg-wrap { width: 28px; height: 28px; }
    .icon-grid.size-medium .icon-svg-wrap { width: 36px; height: 36px; }
    .icon-grid.size-large  .icon-svg-wrap { width: 44px; height: 44px; }

    .icon-svg-wrap svg { width: 100%; height: 100%; }

    .icon-label {
      font-size: 9px;
      text-align: center;
      color: #555;
      line-height: 1.2;
      word-break: break-word;
      width: 100%;
    }
    .icon-grid.size-small .icon-label { display: none; }

    /* Insert (+) button */
    .insert-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--nvidia-green);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.12s, transform 0.12s, background 0.1s;
      cursor: pointer;
      padding: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    .icon-card:hover .insert-btn {
      opacity: 1;
      transform: scale(1);
    }
    .insert-btn:hover { background: #66a300; }

    /* Category sections */
    .category-section { margin-bottom: 14px; }
    .category-section:first-child .category-title { margin-top: 0; }
    .category-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #888;
      margin: 12px 0 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    /* Detail view ("icon page") */
    .detail-view {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .detail-back {
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--nvidia-green);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-bottom: 6px;
    }
    .detail-back:hover { text-decoration: underline; }
    .detail-icon-wrap {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--nvidia-dark);
      background: var(--bg);
      border-radius: 10px;
    }
    .detail-icon-wrap svg { width: 100%; height: 100%; }
    .detail-name {
      font-size: 15px;
      font-weight: 700;
      text-align: center;
    }
    .detail-category {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .detail-insert-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--nvidia-green);
      color: #fff;
      border: none;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.1s;
    }
    .detail-insert-btn:hover { background: #66a300; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #999;
    }
    .empty-state svg { margin-bottom: 8px; color: #ccc; }
    .empty-state p { font-size: 13px; font-weight: 600; color: #666; }
    .empty-state small { font-size: 11px; }

    /* Toast notification */
    #toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: var(--nvidia-dark);
      color: #fff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      transition: transform 0.2s, opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.success { background: var(--nvidia-green); }
    #toast.error { background: #e53e3e; }
  </style>
</head>

// ── SYNONYMS ─────────────────────────────────────────────────────────────────
function expandSearchTerms(query) {
  const lower = query.toLowerCase().trim();
  const terms = new Set([lower]);
  if (synonymMap[lower]) synonymMap[lower].forEach(t => terms.add(t));
  Object.entries(synonymMap).forEach(([key, vals]) => {
    if (vals.includes(lower)) {
      terms.add(key);
      vals.forEach(t => terms.add(t));
    }
  });
  return Array.from(terms);
}

// ── STATE ────────────────────────────────────────────────────────────────────
let searchQuery = '';
let selectedCategory = 'all';
let iconSize = 'medium';
let officeReady = false;

// ── CATEGORIES ───────────────────────────────────────────────────────────────
const allCategories = ['all', ...Array.from(new Set(icons.map(i => i.category))).sort()];
function formatCategory(cat) {
  if (cat === 'all') return 'All Categories';
  const special = { 'ai-ml': 'AI/ML', 'telecommunications': 'Telecom' };
  if (special[cat]) return special[cat];
  return cat.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
}

const catSelect = document.getElementById('categorySelect');
allCategories.forEach(cat => {
  const opt = document.createElement('option');
  opt.value = cat;
  opt.textContent = formatCategory(cat);
  catSelect.appendChild(opt);
});

// ── SEARCH ───────────────────────────────────────────────────────────────────
function filterIcons() {
  if (!searchQuery.trim()) {
    const result = selectedCategory === 'all'
      ? icons
      : icons.filter(i => i.category === selectedCategory);
    return { filtered: result, isSemantic: false };
  }
  const query = searchQuery.toLowerCase();
  const exact = [], semantic = [];
  let usedSemantic = false;
  icons.forEach(icon => {
    if (selectedCategory !== 'all' && icon.category !== selectedCategory) return;
    const text = `${icon.name} ${icon.displayName} ${icon.category}`.toLowerCase();
    if (text.includes(query)) {
      exact.push(icon);
    } else {
      const expanded = expandSearchTerms(query);
      if (expanded.some(t => text.includes(t))) {
        semantic.push(icon);
        usedSemantic = true;
      }
    }
  });
  return { filtered: [...exact, ...semantic], isSemantic: usedSemantic && exact.length === 0 };
}

const clearBtn = document.getElementById('clearBtn');
const subtitle = document.getElementById('subtitle');
const browseView = document.getElementById('browseView');
const detailView = document.getElementById('detailView');

function makeSVG(pathData, size) {
  const dim = size === 'small' ? 28 : size === 'medium' ? 36 : size === 'large' ? 44 : size === 'detail' ? 140 : 36;
  return `<svg viewBox="0 0 48 48" width="${dim}" height="${dim}" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="${pathData}" fill="currentColor"/>
  </svg>`;
}

function groupByCategory(list) {
  const map = new Map();
  list.forEach(icon => {
    if (!map.has(icon.category)) map.set(icon.category, []);
    map.get(icon.category).push(icon);
  });
  return allCategories
    .filter(cat => cat !== 'all' && map.has(cat))
    .map(cat => ({ category: cat, items: map.get(cat) }));
}

function makeInsertBtn(icon, pathData) {
  const btn = document.createElement('button');
  btn.className = 'insert-btn';
  btn.title = 'Insert as SVG';
  btn.setAttribute('aria-label', 'Insert as SVG');
  btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
    <path stroke-linecap="round" d="M12 5v14M5 12h14"/>
  </svg>`;
  btn.addEventListener('click', (e) => { e.stopPropagation(); copySvg(icon, pathData); });
  return btn;
}

function render() {
  const { filtered, isSemantic } = filterIcons();
  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.style.display = 'none';
    emptyState.style.display = 'block';
  } else {
    grid.style.display = 'block';
    emptyState.style.display = 'none';

    const fragment = document.createDocumentFragment();
    groupByCategory(filtered).forEach(({ category, items }) => {
      const section = document.createElement('div');
      section.className = 'category-section';

      const title = document.createElement('div');
      title.className = 'category-title';
      title.textContent = `${formatCategory(category)} · ${items.length}`;
      section.appendChild(title);

      const sectionGrid = document.createElement('div');
      sectionGrid.className = `icon-grid size-${iconSize}`;
      items.forEach(icon => {
        const pathData = svgPaths[icon.svgPathKey] || '';
        const card = document.createElement('div');
        card.className = 'icon-card';
        card.title = icon.displayName;
        card.innerHTML = `
          <div class="icon-svg-wrap">${makeSVG(pathData, iconSize)}</div>
          <div class="icon-label">${icon.displayName}</div>
        `;
        card.appendChild(makeInsertBtn(icon, pathData));
        card.addEventListener('click', () => openDetail(icon, pathData));
        sectionGrid.appendChild(card);
      });
      section.appendChild(sectionGrid);
      fragment.appendChild(section);
    });
    grid.appendChild(fragment);
  }

  // Results bar
  let countHTML = `<span>${filtered.length} of ${icons.length}</span>`;
  if (isSemantic) {
    countHTML += ` <span class="smart-badge">⚡ Smart</span>`;
  }
  resultsCount.innerHTML = countHTML;
  clearBtn.style.display = (searchQuery || selectedCategory !== 'all') ? 'inline' : 'none';
}

// ── DETAIL VIEW ("icon page") ───────────────────────────────────────────────
function openDetail(icon, pathData) {
  browseView.style.display = 'none';
  detailView.style.display = 'flex';
  detailView.innerHTML = `
    <button class="detail-back" id="detailBack">‹ Back</button>
    <div class="detail-icon-wrap">${makeSVG(pathData, 'detail')}</div>
    <div class="detail-name">${icon.displayName}</div>
    <div class="detail-category">${formatCategory(icon.category)}</div>
    <button class="detail-insert-btn" id="detailInsertBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <path stroke-linecap="round" d="M12 5v14M5 12h14"/>
      </svg>
      Insert as SVG
    </button>
  `;
  document.getElementById('detailBack').addEventListener('click', closeDetail);
  document.getElementById('detailInsertBtn').addEventListener('click', () => copySvg(icon, pathData));
}

function closeDetail() {
  detailView.style.display = 'none';
  browseView.style.display = 'block';
}

// ── SVG PATH → OOXML CONVERTER ───────────────────────────────────────────────
// Converts SVG path 'd' attribute into PowerPoint OOXML custom geometry XML.
// The result is a true vector shape: resizable, recolorable in PowerPoint.

function tokenizePath(d) {
  const re = /([MmLlHhVvCcSsQqTtAaZz])|([+-]?(?:\d*\.?\d+|\d+\.?\d*)(?:[eE][+-]?\d+)?)/g;
  const out = []; let m;
  while ((m = re.exec(d)) !== null) out.push(m[1] !== undefined ? m[1] : parseFloat(m[2]));
  return out;
}

function arcToSegs(x1, y1, rx, ry, xDeg, la, sw, x2, y2) {
  if (x1===x2 && y1===y2) return [];
  if (!rx || !ry) return [{cp1:{x:x2,y:y2},cp2:{x:x2,y:y2},end:{x:x2,y:y2}}];
  const phi = xDeg*Math.PI/180, cp=Math.cos(phi), sp=Math.sin(phi);
  const dx=(x1-x2)/2, dy=(y1-y2)/2;
  const x1p=cp*dx+sp*dy, y1p=-sp*dx+cp*dy;
  let rx2=rx*rx, ry2=ry*ry, x1p2=x1p*x1p, y1p2=y1p*y1p;
  const lam=Math.sqrt(x1p2/rx2+y1p2/ry2);
  if (lam>1){rx*=lam;ry*=lam;rx2=rx*rx;ry2=ry*ry;}
  const sq=Math.sqrt(Math.max(0,(rx2*ry2-rx2*y1p2-ry2*x1p2)/(rx2*y1p2+ry2*x1p2)));
  const sgn=(la!==sw)?1:-1;
  const cxp=sgn*sq*rx*y1p/ry, cyp=sgn*-sq*ry*x1p/rx;
  const cx=cp*cxp-sp*cyp+(x1+x2)/2, cy=sp*cxp+cp*cyp+(y1+y2)/2;
  const ux=(x1p-cxp)/rx, uy=(y1p-cyp)/ry, vx=(-x1p-cxp)/rx, vy=(-y1p-cyp)/ry;
  let a1=Math.atan2(uy,ux), dA=Math.atan2(vy,vx)-a1;
  if (!sw&&dA>0) dA-=2*Math.PI; if (sw&&dA<0) dA+=2*Math.PI;
  const n=Math.max(1,Math.ceil(Math.abs(dA)/(Math.PI/2))), da=dA/n, segs=[];
  for (let i=0;i<n;i++){
    const a=a1+i*da, b=a1+(i+1)*da, al=4/3*Math.tan(da/4);
    const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);
    segs.push({
      cp1:{x:cx+cp*(rx*(ca-al*sa))-sp*(ry*(sa+al*ca)), y:cy+sp*(rx*(ca-al*sa))+cp*(ry*(sa+al*ca))},
      cp2:{x:cx+cp*(rx*(cb+al*sb))-sp*(ry*(sb-al*cb)), y:cy+sp*(rx*(cb+al*sb))+cp*(ry*(sb-al*cb))},
      end:{x:cx+cp*rx*cb-sp*ry*sb, y:cy+sp*rx*cb+cp*ry*sb}
    });
  }
  return segs;
}

function svgToOoxmlPath(d) {
  const S=1000; // coordinate scale: SVG 48×48 → OOXML 48000×48000
  const tok=tokenizePath(d);
  let ti=0, xml='', x=0, y=0, sx=0, sy=0, lcp={x:0,y:0}, lc='';
  const pt=(px,py)=>`<a:pt x="${Math.round(px*S)}" y="${Math.round(py*S)}"/>`;
  const n=(k)=>{ const r=[];
    while(r.length<k && ti<tok.length && typeof tok[ti]==='number') r.push(tok[ti++]);
    return r; };

  while (ti<tok.length) {
    const c=tok[ti++]; if (typeof c!=='string') continue;
    do {
      if (c==='M'||c==='m') {
        const [dx,dy]=n(2);
        if(c==='M'){x=dx;y=dy;}else{x+=dx;y+=dy;}
        sx=x;sy=y; xml+=`<a:moveTo>${pt(x,y)}</a:moveTo>`;
      } else if (c==='L'||c==='l') {
        const [dx,dy]=n(2);
        if(c==='L'){x=dx;y=dy;}else{x+=dx;y+=dy;}
        xml+=`<a:lnTo>${pt(x,y)}</a:lnTo>`;
      } else if (c==='H'||c==='h') {
        const [v]=n(1); x=(c==='H')?v:x+v; xml+=`<a:lnTo>${pt(x,y)}</a:lnTo>`;
      } else if (c==='V'||c==='v') {
        const [v]=n(1); y=(c==='V')?v:y+v; xml+=`<a:lnTo>${pt(x,y)}</a:lnTo>`;
      } else if (c==='C'||c==='c') {
        const r=n(6);
        const [x1,y1,x2,y2,ex,ey]=(c==='C')?r:[x+r[0],y+r[1],x+r[2],y+r[3],x+r[4],y+r[5]];
        xml+=`<a:cubicBezTo>${pt(x1,y1)}${pt(x2,y2)}${pt(ex,ey)}</a:cubicBezTo>`;
        lcp={x:x2,y:y2}; x=ex; y=ey;
      } else if (c==='S'||c==='s') {
        const r=n(4);
        const [x2,y2,ex,ey]=(c==='S')?r:[x+r[0],y+r[1],x+r[2],y+r[3]];
        const x1='CScs'.includes(lc)?2*x-lcp.x:x, y1='CScs'.includes(lc)?2*y-lcp.y:y;
        xml+=`<a:cubicBezTo>${pt(x1,y1)}${pt(x2,y2)}${pt(ex,ey)}</a:cubicBezTo>`;
        lcp={x:x2,y:y2}; x=ex; y=ey;
      } else if (c==='Q'||c==='q') {
        const r=n(4);
        const [qx,qy,ex,ey]=(c==='Q')?r:[x+r[0],y+r[1],x+r[2],y+r[3]];
        const cx1=x+2/3*(qx-x),cy1=y+2/3*(qy-y),cx2=ex+2/3*(qx-ex),cy2=ey+2/3*(qy-ey);
        xml+=`<a:cubicBezTo>${pt(cx1,cy1)}${pt(cx2,cy2)}${pt(ex,ey)}</a:cubicBezTo>`;
        lcp={x:qx,y:qy}; x=ex; y=ey;
      } else if (c==='T'||c==='t') {
        const r=n(2);
        const [ex,ey]=(c==='T')?r:[x+r[0],y+r[1]];
        const qx='QqTt'.includes(lc)?2*x-lcp.x:x, qy='QqTt'.includes(lc)?2*y-lcp.y:y;
        const cx1=x+2/3*(qx-x),cy1=y+2/3*(qy-y),cx2=ex+2/3*(qx-ex),cy2=ey+2/3*(qy-ey);
        xml+=`<a:cubicBezTo>${pt(cx1,cy1)}${pt(cx2,cy2)}${pt(ex,ey)}</a:cubicBezTo>`;
        lcp={x:qx,y:qy}; x=ex; y=ey;
      } else if (c==='A'||c==='a') {
        const r=n(7);
        const [rx,ry,xr,la,sw,nx,ny]=(c==='A')?r:[r[0],r[1],r[2],r[3],r[4],x+r[5],y+r[6]];
        arcToSegs(x,y,rx,ry,xr,la===1,sw===1,nx,ny).forEach(s=>{
          xml+=`<a:cubicBezTo>${pt(s.cp1.x,s.cp1.y)}${pt(s.cp2.x,s.cp2.y)}${pt(s.end.x,s.end.y)}</a:cubicBezTo>`;
        });
        x=nx; y=ny;
      } else if (c==='Z'||c==='z') {
        xml+=`<a:close/>`; x=sx; y=sy;
      }
      lc=c;
    } while (ti<tok.length && typeof tok[ti]==='number');
  }
  return xml;
}

function buildOoxmlSlide(pathData, sizeIn) {
  const emu = Math.round(sizeIn * 914400);
  const off = Math.round(0.75 * 914400);
  const pathXml = svgToOoxmlPath(pathData);
  return `<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr><p:sp><p:nvSpPr><p:cNvPr id="2" name="Icon"/><p:cNvSpPr><a:spLocks noChangeArrowheads="1"/></p:cNvSpPr><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${off}" y="${off}"/><a:ext cx="${emu}" cy="${emu}"/></a:xfrm><a:custGeom><a:avLst/><a:gdLst/><a:ahLst/><a:cxnLst/><a:rect l="l" t="t" r="r" b="b"/><a:pathLst><a:path w="48000" h="48000">${pathXml}</a:path></a:pathLst></a:custGeom><a:solidFill><a:srgbClr val="1a1a1a"/></a:solidFill><a:ln><a:noFill/></a:ln></p:spPr></p:sp></p:spTree></p:cSld></p:sld>`;
}

// ── CENTERED VIEWBOX HELPER ──────────────────────────────────────────────────
// Many of the source icons don't fill their 48×48 viewBox symmetrically — the
// visible glyph can be drawn entirely within, say, x=4..40, y=2..46 — so when
// we render the path inside a 200×200 square, the icon ends up offset toward
// one side. This helper measures the path's real bounding box and returns a
// square viewBox centered on that, with a small padding ring. Used by both
// PNG canvas rendering and direct SVG insert so icons sit visually centered.
function getCenteredViewBox(pathData) {
  try {
    const ns = 'http://www.w3.org/2000/svg';
    const tmp = document.createElementNS(ns, 'svg');
    tmp.setAttribute('xmlns', ns);
    tmp.setAttribute('width', '0');
    tmp.setAttribute('height', '0');
    tmp.style.position = 'absolute';
    tmp.style.left = '-9999px';
    tmp.style.top = '-9999px';
    const p = document.createElementNS(ns, 'path');
    p.setAttribute('d', pathData);
    tmp.appendChild(p);
    document.body.appendChild(tmp);
    const b = p.getBBox();
    document.body.removeChild(tmp);
    if (!b || !isFinite(b.width) || !isFinite(b.height) || b.width <= 0 || b.height <= 0) {
      return { x: 0, y: 0, size: 48 };
    }
    const dim = Math.max(b.width, b.height);
    const pad = dim * 0.06;               // 6% breathing room on all sides
    const totalDim = dim + 2 * pad;
    const cx = b.x + b.width / 2;
    const cy = b.y + b.height / 2;
    return { x: cx - totalDim / 2, y: cy - totalDim / 2, size: totalDim };
  } catch (e) {
    return { x: 0, y: 0, size: 48 };
  }
}

// ── INSERT AS SVG ────────────────────────────────────────────────────────────
// On Windows / PowerPoint Online: insert SVG directly onto the slide using
// the XmlSvg coercion (modern Office). Falls back to file download on Mac
// (and on any platform where direct insert is not supported), since Mac
// PowerPoint's Office.js does not yet accept SVG via setSelectedDataAsync.
function copySvg(icon, pathData) {
  if (!officeReady) { showToast('Office not ready yet…', 'error'); return; }

  // Use a large intrinsic size (200×200, matching PNG behavior). PowerPoint
  // on Windows honors the SVG's width/height attributes when inserting via
  // xmlSvg and ignores imageWidth/imageHeight hints — so a 48×48 SVG ends up
  // inserted at ~half an inch on the slide. 200×200 displays at ~2 inches
  // and (being vector) stays crisp at any later resize. The viewBox is
  // computed from the path's real bbox so the glyph sits visually centered.
  const vb = getCenteredViewBox(pathData);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.x} ${vb.y} ${vb.size} ${vb.size}" width="200" height="200">
  <path d="${pathData}" fill="#1a1a1a"/>
</svg>`;

  const platform = Office.context.platform;
  const isWindowsLike =
    platform === Office.PlatformType.PC ||
    platform === Office.PlatformType.OfficeOnline;

  const downloadSvgFile = () => {
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = icon.name + '.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('✓ Saved — Insert > Pictures in PowerPoint', 'success');
  };

  if (!isWindowsLike) {
    // Mac (and unknown platforms): fall back to file download flow
    downloadSvgFile();
    return;
  }

  // Windows / Online: try modern SVG coercion first.
  // Note: imageWidth / imageHeight in Office.js are measured in POINTS
  // (1/72 inch), not inches — so the old "2, 2" was actually 2 points,
  // i.e. ~3 pixels, which is why the SVG was inserting absurdly small.
  // We omit them entirely so PowerPoint uses the SVG's intrinsic
  // width / height (200×200, as declared on the <svg> element above).
  try {
    Office.context.document.setSelectedDataAsync(svg, {
      coercionType: 'xmlSvg',
      imageLeft: 1, imageTop: 1
    }, r1 => {
      if (r1 && r1.status === Office.AsyncResultStatus.Succeeded) {
        showToast('✓ ' + icon.displayName + ' inserted as SVG', 'success');
        return;
      }
      // Second try: base64-encoded SVG via image coercion (some Windows builds)
      try {
        const base64 = btoa(unescape(encodeURIComponent(svg)));
        Office.context.document.setSelectedDataAsync(base64, {
          coercionType: Office.CoercionType.Image,
          imageLeft: 1, imageTop: 1
        }, r2 => {
          if (r2 && r2.status === Office.AsyncResultStatus.Succeeded) {
            showToast('✓ ' + icon.displayName + ' inserted as SVG', 'success');
          } else {
            downloadSvgFile();
          }
        });
      } catch (e) {
        downloadSvgFile();
      }
    });
  } catch (e) {
    downloadSvgFile();
  }
}

// ── TOAST ────────────────────────────────────────────────────────────────────
let toastTimer;
const toast = document.getElementById('toast');
function showToast(msg, type = '') {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.className = 'show ' + type;
  toastTimer = setTimeout(() => { toast.className = ''; }, 2500);
}

// ── EVENT LISTENERS ───────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

catSelect.addEventListener('change', e => {
  selectedCategory = e.target.value;
  render();
});

document.querySelectorAll('.size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    iconSize = btn.dataset.size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

clearBtn.addEventListener('click', () => {
  searchQuery = '';
  selectedCategory = 'all';
  document.getElementById('searchInput').value = '';
  catSelect.value = 'all';
  render();
});

// ── OFFICE INIT ───────────────────────────────────────────────────────────────
Office.onReady(info => {
  officeReady = true;
  subtitle.textContent = `${icons.length} icons · click to view, hover + to insert`;
  render();
});

// Fallback for testing outside Office
window.addEventListener('load', () => {
  if (!officeReady) {
    setTimeout(() => {
      if (!officeReady) {
        subtitle.textContent = `${icons.length} icons (preview mode — open in PowerPoint to insert)`;
        render();
      }
    }, 1500);
  }
});
</script>
